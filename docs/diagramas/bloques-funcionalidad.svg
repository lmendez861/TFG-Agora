<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120">
  <defs>
    <style>
      .bg { fill: #f5f7fb; }
      .title { font: 700 36px 'Segoe UI', Arial, sans-serif; fill: #17314c; }
      .subtitle { font: 500 19px 'Segoe UI', Arial, sans-serif; fill: #4d647b; }
      .card { fill: #ffffff; stroke: #1b3655; stroke-width: 2.2; rx: 24; ry: 24; }
      .card-soft { fill: #eef4fb; stroke: #1b3655; stroke-width: 2.2; rx: 24; ry: 24; }
      .card-warm { fill: #fff3db; stroke: #a36d1d; stroke-width: 2.2; rx: 24; ry: 24; }
      .card-dark { fill: #142a44; stroke: #142a44; stroke-width: 2.2; rx: 24; ry: 24; }
      .eyebrow { font: 700 14px 'Segoe UI', Arial, sans-serif; fill: #567089; letter-spacing: 0.16em; text-transform: uppercase; }
      .eyebrow-dark { font: 700 14px 'Segoe UI', Arial, sans-serif; fill: #f1c36c; letter-spacing: 0.16em; text-transform: uppercase; }
      .heading { font: 700 24px 'Segoe UI', Arial, sans-serif; fill: #1a3554; }
      .heading-dark { font: 700 24px 'Segoe UI', Arial, sans-serif; fill: #ffffff; }
      .body { font: 400 15px 'Segoe UI', Arial, sans-serif; fill: #263b4f; }
      .body-dark { font: 400 15px 'Segoe UI', Arial, sans-serif; fill: #dbe6f3; }
      .foot { font: 600 16px 'Segoe UI', Arial, sans-serif; fill: #3a5774; }
      .line-main { stroke: #3a628f; stroke-width: 4; fill: none; marker-end: url(#arrow); }
      .line-soft { stroke: #6b8eb3; stroke-width: 3; fill: none; marker-end: url(#arrowSoft); }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#3a628f"/>
    </marker>
    <marker id="arrowSoft" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#6b8eb3"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1800" height="1120"/>
  <text class="title" x="58" y="72">Arquitectura operativa y de despliegue de Agora</text>
  <text class="subtitle" x="58" y="108">Una sola URL publica, dos portales separados, backend Symfony y una consola tecnica de escritorio como soporte local o cloud.</text>

  <rect class="card-warm" x="60" y="170" width="350" height="185"/>
  <text class="eyebrow" x="90" y="206">Acceso centro</text>
  <text class="heading" x="90" y="244">Portal interno /app</text>
  <text class="body" x="90" y="286">- dashboard, entidades y</text>
  <text class="body" x="90" y="316">exportacion CSV</text>
  <text class="body" x="90" y="346">- solicitudes, revision y bandeja</text>
  <text class="body" x="90" y="376">- seguimiento academico y documental</text>

  <rect class="card-warm" x="60" y="390" width="350" height="185"/>
  <text class="eyebrow" x="90" y="426">Acceso empresa</text>
  <text class="heading" x="90" y="464">Portal externo /externo</text>
  <text class="body" x="90" y="506">- alta de cuenta y verificacion</text>
  <text class="body" x="90" y="536">- solicitud, estado y acceso</text>
  <text class="body" x="90" y="566">persistente</text>
  <text class="body" x="90" y="596">- chat y continuidad tras aprobacion</text>

  <rect class="card" x="60" y="610" width="350" height="150"/>
  <text class="eyebrow" x="90" y="646">Acceso publico</text>
  <text class="heading" x="90" y="684">Guia /documentacion</text>
  <text class="body" x="90" y="718">Memoria, capturas, anexos y</text>
  <text class="body" x="90" y="746">guion de defensa.</text>

  <rect class="card-dark" x="60" y="785" width="350" height="210"/>
  <text class="eyebrow-dark" x="90" y="821">Operacion tecnica</text>
  <text class="heading-dark" x="90" y="860">Agora Desktop</text>
  <text class="body-dark" x="90" y="902">- modo local de respaldo</text>
  <text class="body-dark" x="90" y="932">- modo cloud por HTTPS y SSH</text>
  <text class="body-dark" x="90" y="962">- logs, servicio, pruebas</text>
  <text class="body-dark" x="90" y="992">y URL efectiva</text>

  <rect class="card-soft" x="560" y="120" width="290" height="96"/>
  <text class="eyebrow" x="594" y="157">Borde publico</text>
  <text class="heading" x="594" y="195">DNS nip.io + HTTPS</text>

  <rect class="card-soft" x="470" y="250" width="460" height="660"/>
  <text class="eyebrow" x="505" y="288">VM Google Cloud Compute Engine</text>
  <text class="heading" x="505" y="326">Caddy + app + Docker Compose</text>

  <rect class="card" x="505" y="360" width="390" height="150"/>
  <text class="eyebrow" x="535" y="396">Shell publica integrada</text>
  <text class="heading" x="535" y="432">Una sola raiz web</text>
  <text class="body" x="535" y="466">/app, /externo y</text>
  <text class="body" x="535" y="494">/documentacion</text>

  <rect class="card" x="505" y="530" width="390" height="235"/>
  <text class="eyebrow" x="535" y="556">Backend de negocio</text>
  <text class="heading" x="535" y="592">Symfony 7 + Apache/PHP</text>
  <text class="body" x="535" y="628">- autenticacion, roles, sesiones</text>
  <text class="body" x="535" y="656">y rate limit</text>
  <text class="body" x="535" y="684">- empresas, convenios, estudiantes</text>
  <text class="body" x="535" y="712">y asignaciones</text>
  <text class="body" x="535" y="740">- correo, documentos, auditoria y pruebas</text>

  <rect class="card-soft" x="1010" y="140" width="300" height="115"/>
  <text class="eyebrow" x="1044" y="176">Persistencia</text>
  <text class="heading" x="1044" y="214">PostgreSQL 16</text>
  <text class="body" x="1044" y="248">Base de datos permanente</text>
  <text class="body" x="1044" y="276">de la VM.</text>

  <rect class="card-soft" x="1010" y="285" width="300" height="170"/>
  <text class="eyebrow" x="1044" y="321">Documentos y datos</text>
  <text class="heading" x="1044" y="359">Volumenes persistentes</text>
  <text class="body" x="1044" y="393">- documentos privados</text>
  <text class="body" x="1044" y="423">- datos PostgreSQL y cache</text>
  <text class="body" x="1044" y="451">de servicio</text>

  <rect class="card-soft" x="1010" y="455" width="300" height="145"/>
  <text class="eyebrow" x="1044" y="491">Correo transaccional</text>
  <text class="heading" x="1044" y="529">Brevo</text>
  <text class="body" x="1044" y="563">Verificacion, rechazo, reset</text>
  <text class="body" x="1044" y="591">y MFA local.</text>

  <rect class="card-soft" x="1010" y="610" width="300" height="190"/>
  <text class="eyebrow" x="1044" y="646">Operacion remota</text>
  <text class="heading" x="1044" y="684">SSH + agora.service</text>
  <text class="body" x="1044" y="718">- arranque automatico y reinicios</text>
  <text class="body" x="1044" y="748">- logs, smoke cloud y</text>
  <text class="body" x="1044" y="778">backup PostgreSQL</text>

  <rect class="card" x="1360" y="250" width="350" height="155"/>
  <text class="eyebrow" x="1394" y="286">Modo local</text>
  <text class="heading" x="1394" y="324">Desktop + localhost</text>
  <text class="body" x="1394" y="358">SQLite y runtime empaquetado</text>
  <text class="body" x="1394" y="386">para demo si la VM cloud</text>
  <text class="body" x="1394" y="414">no esta disponible.</text>

  <rect class="card" x="1360" y="430" width="350" height="165"/>
  <text class="eyebrow" x="1394" y="466">Modo principal</text>
  <text class="heading" x="1394" y="504">Desktop + URL cloud</text>
  <text class="body" x="1394" y="538">Estado por API HTTPS y</text>
  <text class="body" x="1394" y="566">operacion tecnica por SSH</text>
  <text class="body" x="1394" y="594">sobre la misma instancia.</text>

  <rect class="card" x="1360" y="620" width="350" height="175"/>
  <text class="eyebrow" x="1394" y="656">Resultado defendible</text>
  <text class="heading" x="1394" y="694">Flujo cerrado</text>
  <text class="body" x="1394" y="728">Portal interno, portal externo,</text>
  <text class="body" x="1394" y="756">documentacion, correo real,</text>
  <text class="body" x="1394" y="784">despliegue cloud y consola tecnica.</text>

  <path class="line-main" d="M410 260 H458"/>
  <path class="line-main" d="M410 482 H458"/>
  <path class="line-main" d="M410 678 H458"/>
  <path class="line-main" d="M410 875 H458"/>
  <path class="line-main" d="M705 216 V244"/>

  <path class="line-main" d="M930 420 H998"/>
  <path class="line-main" d="M930 560 H998"/>
  <path class="line-main" d="M930 650 H998"/>

  <text class="foot" x="62" y="1058">La misma URL publica sirve panel interno, portal externo y documentacion; Agora Desktop separa la operacion tecnica del flujo funcional y puede trabajar en local o en cloud.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120">
  <defs>
    <style>
      .bg { fill: #f6f8fb; }
      .title { font: 700 34px 'Segoe UI', Arial, sans-serif; fill: #16314b; }
      .subtitle { font: 500 18px 'Segoe UI', Arial, sans-serif; fill: #4d647b; }
      .table { fill: #ffffff; stroke: #1d3654; stroke-width: 2; rx: 18; ry: 18; }
      .table-soft { fill: #eef4fb; stroke: #1d3654; stroke-width: 2; rx: 18; ry: 18; }
      .head { fill: #183153; }
      .name { font: 700 20px 'Segoe UI', Arial, sans-serif; fill: #ffffff; }
      .field { font: 400 15px 'Consolas', monospace; fill: #21384c; }
      .caption { font: 600 14px 'Segoe UI', Arial, sans-serif; fill: #4f6a84; letter-spacing: 0.04em; text-transform: uppercase; }
      .rel { stroke: #3d6389; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .label { font: 600 13px 'Segoe UI', Arial, sans-serif; fill: #35577a; }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#3d6389"/>
    </marker>

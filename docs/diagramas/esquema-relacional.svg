  <rect class="bg" x="0" y="0" width="1800" height="1120"/>
  <text class="title" x="52" y="70">Esquema relacional del nucleo empresa-centro y operativa academica</text>
  <text class="subtitle" x="52" y="104">El diagrama se centra en la continuidad entre preregistro, cuenta portal, empresa aprobada, mensajes, convenios y asignaciones.</text>

  <text class="caption" x="58" y="150">Onboarding y relacion externa</text>
  <text class="caption" x="760" y="150">Empresa aprobada y operativa</text>
  <text class="caption" x="1340" y="150">Ciclo academico</text>

